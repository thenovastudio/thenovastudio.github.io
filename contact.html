  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<nav class="nav">
  <div class="logo">
    <a href="index.html">
      <img src="assets/images/logo.png" alt="Nova Studio logo" />
    </a>
  </div>
  <ul class="nav-links">
  <li><a href="index.html" >Home</a></li>
  <li><a href="work.html" >Werk</a></li>
  <li><a href="services.html" >Diensten</a></li>

</ul>
  <button class="hamburger" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<main class="container">
  <h1>Contact</h1>

  <div class="card">
    <div class="card-icon">
      <i data-lucide="mail"></i>
    </div>
    <p>
      Interesse in een samenwerking of een idee dat je wil uitwerken?
      Neem vrijblijvend contact op.
    </p>
    <p>
      <strong>E-mail</strong><br />
      contact@thenovastudio.be
    </p>
  </div>

  <div class="card contact-card">
    <h2>Stuur een bericht</h2>
    <form action="https://formspree.io/f/xlgredkp" method="POST">
      <label for="email">Uw e-mail:</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Uw bericht:</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit" class="cta">Verstuur</button>
    </form>
  </div>
</main>

<script>
  lucide.createIcons();
</script>
<script src="js/page-transition.js"></script>
<script src="js/hamburger.js"></script>

</body>
</html>
